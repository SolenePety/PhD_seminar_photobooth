<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-touch-fullscreen" content="yes">
<title>PhotoBooth Doctorants</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  background: #111;
  color: #fafafa;
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
:root {
  --coral: #E05A3A;
  --blue: #3A78C9;
  --dark: #111;
  --white: #fafafa;
}

/* ── SCREENS ── */
.screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.screen.on { opacity: 1; pointer-events: all; }

/* ── WELCOME ── */
#sw {
  background: radial-gradient(ellipse at 25% 20%, rgba(58,120,201,0.2) 0%,transparent 55%),
              radial-gradient(ellipse at 75% 80%, rgba(224,90,58,0.15) 0%,transparent 55%),
              #111;
  gap: 26px; padding: 48px 24px 36px;
  justify-content: center;
}
.logo-wrap {
  width: 160px; height: 160px;
  border-radius: 50%;
  border: 2px solid rgba(224,90,58,0.5);
  box-shadow: 0 0 40px rgba(58,120,201,0.2);
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; background: rgba(255,255,255,0.03);
  flex-shrink: 0;
}
.logo-wrap img { width: 148px; height: 148px; object-fit: contain; }
.ttl { text-align: center; }
.ttl h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(1.5rem,4.5vw,2rem); line-height: 1.2;
  background: linear-gradient(135deg,#E05A3A,#D4A843);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.ttl p { font-size:0.75rem; color:rgba(255,255,255,0.4); letter-spacing:0.1em; text-transform:uppercase; margin-top:5px; }

.modes { display:flex; gap:10px; width:100%; max-width:460px; }
.mbtn {
  flex:1; background:rgba(255,255,255,0.04);
  border:1.5px solid rgba(255,255,255,0.1); border-radius:16px;
  padding:15px 6px; color:#fafafa; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  font-family:'DM Sans',sans-serif;
  transition: border-color 0.2s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
  min-height: 80px;
}
.mbtn.sel {
  border-color:var(--coral);
  background:rgba(224,90,58,0.12);
  box-shadow:0 0 16px rgba(224,90,58,0.15);
}
.mbtn .ico { font-size:1.6rem; }
.mbtn .lbl { font-size:0.8rem; font-weight:500; }
.mbtn .sub { font-size:0.66rem; color:rgba(255,255,255,0.38); }

.gobtn {
  width:100%; max-width:300px;
  background:linear-gradient(135deg,#E05A3A,#c94a2a);
  color:#fff; border:none; border-radius:50px;
  padding:17px; font-family:'DM Sans',sans-serif;
  font-size:1rem; font-weight:500; letter-spacing:0.04em;
  cursor:pointer; box-shadow:0 4px 20px rgba(224,90,58,0.35);
  -webkit-tap-highlight-color: transparent;
  min-height: 56px;
}

/* ── CAMERA ── */
#sc { justify-content:flex-start; background:#000; padding:0; }
.topbar {
  width:100%; display:flex; align-items:center;
  justify-content:space-between; padding:14px 18px;
  background:rgba(0,0,0,0.8); flex-shrink:0; z-index:10;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.topbtn {
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff; border-radius:10px; padding:9px 18px;
  font-size:0.82rem; font-family:'DM Sans',sans-serif;
  cursor:pointer; min-width:80px; min-height:42px;
  -webkit-tap-highlight-color: transparent;
}
.toplabel { font-size:0.8rem; color:rgba(255,255,255,0.45); }
.dots { display:flex; gap:8px; }
.dot { width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.2); transition:all 0.3s; }
.dot.done { background:var(--coral); }
.dot.cur { background:#D4A843; transform:scale(1.35); }

.vfwrap {
  flex:1; width:100%; position:relative;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; background:#000;
}
#video {
  width:100%; height:100%; object-fit:cover;
  transform:scaleX(-1);
}
.corners { position:absolute; inset:14px; pointer-events:none; }
.corner {
  position:absolute; width:28px; height:28px;
  border-color:rgba(224,90,58,0.7); border-style:solid;
}
.corner.tl { top:0;left:0; border-width:2px 0 0 2px; border-radius:4px 0 0 0; }
.corner.tr { top:0;right:0; border-width:2px 2px 0 0; border-radius:0 4px 0 0; }
.corner.bl { bottom:0;left:0; border-width:0 0 2px 2px; border-radius:0 0 0 4px; }
.corner.br { bottom:0;right:0; border-width:0 2px 2px 0; border-radius:0 0 4px 0; }
#cdown {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'Playfair Display',serif; font-size:6rem; color:#fff;
  background:rgba(0,0,0,0.3); opacity:0; pointer-events:none;
  transition:opacity 0.15s; text-shadow:0 2px 20px rgba(0,0,0,0.5);
}
#cdown.on { opacity:1; }
#fla {
  position:absolute; inset:0; background:#fff;
  opacity:0; pointer-events:none; transition:opacity 0.06s;
}
#fla.bang { opacity:1; }

.errbox {
  display:none; flex-direction:column; align-items:center;
  gap:16px; padding:48px 28px; text-align:center;
}
.errbox.on { display:flex; }
.errbox h2 { font-family:'Playfair Display',serif; font-size:1.3rem; margin-top:8px; }
.errbox p { color:rgba(255,255,255,0.5); font-size:0.85rem; line-height:1.7; }

.shutbar {
  width:100%; display:flex; align-items:center; justify-content:center;
  padding:22px; background:rgba(0,0,0,0.8); flex-shrink:0;
}
#shut {
  width:72px; height:72px; border-radius:50%;
  border:3px solid rgba(255,255,255,0.85);
  background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color: transparent;
  transition:transform 0.15s;
}
#shut::after {
  content:''; width:54px; height:54px; border-radius:50%;
  background:rgba(255,255,255,0.9);
}
#shut:disabled { opacity:0.3; pointer-events:none; }

/* ── RESULT ── */
#sr {
  justify-content:flex-start; align-items:center;
  background:radial-gradient(ellipse at 50% 0%,rgba(58,120,201,0.1) 0%,transparent 55%),#111;
  overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 0 48px;
}
.resbar {
  width:100%; display:flex; align-items:center; justify-content:space-between;
  padding:13px 18px; background:rgba(0,0,0,0.5);
  border-bottom:1px solid rgba(255,255,255,0.06); flex-shrink:0;
}
.resbar span { font-size:0.78rem; color:rgba(255,255,255,0.35); }
.resc {
  width:100%; max-width:420px; display:flex;
  flex-direction:column; align-items:center; gap:16px; padding:20px 16px;
}
.strip {
  width:100%; background:#fff; border-radius:4px;
  box-shadow:0 6px 36px rgba(0,0,0,0.55);
  padding:10px 10px 0;
}
.stimgs { display:flex; flex-direction:column; gap:5px; }
.stimgs img { width:100%; display:block; border-radius:2px; }
.stfoot {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 3px 7px;
}
.stfoot img { height:30px; object-fit:contain; }
.stfoot .txt {
  font-family:'Playfair Display',serif; font-style:italic;
  font-size:0.58rem; color:#222; text-align:right; line-height:1.5;
}

.acts { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; }
.abtn {
  display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:14px 8px;
  background:rgba(255,255,255,0.04);
  border:1.5px solid rgba(255,255,255,0.1); border-radius:14px;
  color:#fafafa; cursor:pointer;
  font-family:'DM Sans',sans-serif; font-size:0.82rem;
  transition:border-color 0.2s; min-height:72px;
  -webkit-tap-highlight-color: transparent;
}
.abtn .ico { font-size:1.3rem; }

.mpanel {
  width:100%; background:rgba(255,255,255,0.04);
  border:1.5px solid rgba(255,255,255,0.1); border-radius:14px;
  padding:16px; display:none; flex-direction:column; gap:10px;
}
.mpanel.on { display:flex; }
.mpanel label { font-size:0.8rem; color:rgba(255,255,255,0.5); }
.mpanel input {
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.15); border-radius:10px;
  padding:12px 14px; color:#fff; outline:none; width:100%;
  font-family:'DM Sans',sans-serif; font-size:1rem;
  -webkit-appearance:none;
}
.mpanel input:focus { border-color:var(--blue); }
.senbtn {
  background:linear-gradient(135deg,#3A78C9,#255fa0);
  color:#fff; border:none; border-radius:10px;
  padding:13px; font-family:'DM Sans',sans-serif;
  font-size:0.9rem; cursor:pointer; font-weight:500;
  min-height:48px;
}

.retrybtn {
  background:rgba(255,255,255,0.05);
  border:1.5px solid rgba(255,255,255,0.1);
  color:#fafafa; border-radius:50px;
  padding:13px 36px; font-family:'DM Sans',sans-serif;
  font-size:0.88rem; cursor:pointer; margin-top:4px;
  -webkit-tap-highlight-color: transparent;
  min-height:48px;
}

/* ── TOAST ── */
#toast {
  position:fixed; bottom:28px; left:50%;
  transform:translateX(-50%) translateY(90px);
  background:rgba(18,18,18,0.96);
  border:1px solid rgba(255,255,255,0.1);
  color:#fff; padding:11px 24px; border-radius:50px;
  font-size:0.84rem; z-index:9999;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  transition:transform 0.38s cubic-bezier(0.34,1.56,0.64,1);
  white-space:nowrap; pointer-events:none;
}
#toast.on { transform:translateX(-50%) translateY(0); }

canvas { display:none; }
</style>
</head>

<canvas id="cv"></canvas>
<div id="toast"></div>

<script>
(function() {
  // ── STATE
  var mode = 'photo';
  var frames = [];
  var stream = null;
  var busy = false;
  var CFG = {
    photo: {n:1, delay:3, label:'Photo'},
    trio:  {n:3, delay:3, label:'3 Photos'},
    gif:   {n:4, delay:2, label:'GIF animé'},
  };

  // ── SCREEN
  function show(id) {
    document.querySelectorAll('.screen').forEach(function(s) {
      s.classList.remove('on');
    });
    document.getElementById(id).classList.add('on');
  }

  // ── WELCOME
  document.querySelectorAll('.mbtn').forEach(function(btn) {
    btn.addEventListener('touchend', function(e) {
      e.preventDefault();
      document.querySelectorAll('.mbtn').forEach(function(b) { b.classList.remove('sel'); });
      btn.classList.add('sel');
      mode = btn.dataset.m;
    });
    btn.addEventListener('click', function() {
      document.querySelectorAll('.mbtn').forEach(function(b) { b.classList.remove('sel'); });
      btn.classList.add('sel');
      mode = btn.dataset.m;
    });
  });

  function tap(id, fn) {
    var el = document.getElementById(id);
    el.addEventListener('touchend', function(e) { e.preventDefault(); fn(); });
    el.addEventListener('click', fn);
  }

  tap('gobtn', openCam);
  tap('bcam', function() { stopStream(); show('sw'); });
  tap('retrycam', openCam);
  tap('shut', shoot);
  tap('bres', reset);
  tap('bret', reset);
  tap('bdl', download);
  tap('bmail', toggleMail);
  tap('bsend', sendMail);
  tap('bshare', shareIt);

  function reset() {
    frames = [];
    document.getElementById('mpanel').classList.remove('on');
    stopStream();
    show('sw');
  }

  // ── CAMERA
  async function openCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      document.getElementById('errbox').classList.add('on');
      document.getElementById('vfw').style.display = 'none';
      show('sc');
      return;
    }
    frames = []; busy = false;
    var cfg = CFG[mode];
    document.getElementById('mlabel').textContent = cfg.label;
    buildDots(cfg.n);
    show('sc');
    document.getElementById('errbox').classList.remove('on');
    document.getElementById('vfw').style.display = 'flex';
    document.getElementById('shut').disabled = false;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      var v = document.getElementById('video');
      v.srcObject = stream;
      v.play().catch(function(e) { console.log('play err', e); });
    } catch(e) {
      console.log('cam err', e);
      document.getElementById('errbox').classList.add('on');
      document.getElementById('vfw').style.display = 'none';
    }
  }

  function stopStream() {
    if (stream) { stream.getTracks().forEach(function(t) { t.stop(); }); stream = null; }
  }

  function buildDots(n) {
    var el = document.getElementById('dots');
    if (n <= 1) { el.innerHTML = ''; return; }
    el.innerHTML = Array.from({length:n}, function(_,i) {
      return '<div class="dot" id="d'+i+'"></div>';
    }).join('');
  }

  function setDot(i) {
    var n = CFG[mode].n;
    for (var j=0; j<n; j++) {
      var d = document.getElementById('d'+j);
      if (d) d.className = 'dot' + (j<i?' done': j===i?' cur':'');
    }
  }

  // ── SHOOT
  async function shoot() {
    if (busy) return;
    busy = true;
    document.getElementById('shut').disabled = true;
    var n = CFG[mode].n;
    var delay = CFG[mode].delay;
    for (var i=0; i<n; i++) {
      if (n>1) setDot(i);
      await countdown(delay);
      await snap();
    }
    busy = false;
    stopStream();
    buildResult();
    show('sr');
  }

  function countdown(secs) {
    return new Promise(function(res) {
      var el = document.getElementById('cdown');
      el.classList.add('on');
      var t = secs; el.textContent = t;
      var iv = setInterval(function() {
        t--;
        if (t <= 0) { clearInterval(iv); el.classList.remove('on'); res(); }
        else el.textContent = t;
      }, 1000);
    });
  }

  function snap() {
    return new Promise(function(res) {
      var v = document.getElementById('video');
      var c = document.getElementById('cv');
      c.width  = v.videoWidth  || 1280;
      c.height = v.videoHeight || 720;
      var ctx = c.getContext('2d');
      ctx.save();
      ctx.translate(c.width, 0); ctx.scale(-1, 1);
      ctx.drawImage(v, 0, 0);
      ctx.restore();
      frames.push(c.toDataURL('image/jpeg', 0.92));
      var fl = document.getElementById('fla');
      fl.classList.add('bang');
      setTimeout(function() { fl.classList.remove('bang'); res(); }, 100);
    });
  }

  // ── RESULT
  function buildResult() {
    var si = document.getElementById('stimgs');
    si.innerHTML = '';
    frames.forEach(function(src) {
      var img = document.createElement('img');
      img.src = src;
      si.appendChild(img);
    });
    if (navigator.share) document.getElementById('bshare').style.display = '';
  }

  // ── DOWNLOAD
  async function download() {
    toast('Génération… ⏳');
    try {
      var url = await buildStrip();
      var a = document.createElement('a');
      a.href = url;
      a.download = mode==='trio'?'trio-doctorants.jpg': mode==='gif'?'gif-doctorants.jpg':'photo-doctorants.jpg';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('Téléchargé ! 📥');
    } catch(e) {
      console.error(e);
      toast('Erreur de téléchargement');
    }
  }

  function buildStrip() {
    var W = 600, n = frames.length;
    var IH = Math.round(W * 9/16);
    var GAP=6, PAD=10, FOOT=56;

  // ── EMAIL
  function toggleMail() {
    document.getElementById('mpanel').classList.toggle('on');
  }
  function sendMail() {
    var email = document.getElementById('minput').value.trim();
    if (!email || !email.includes('@')) { toast('Adresse invalide !'); return; }
    var sub = encodeURIComponent('Votre photo — 29ᵉ Séminaire des Doctorants');
    var body = encodeURIComponent('Bonjour !\n\nVoici votre souvenir du 29ᵉ Séminaire des Doctorants en Génétique Animale.\n\nTéléchargez votre photo depuis l\'app photobooth.\n\nÀ bientôt !');
    window.open('mailto:'+email+'?subject='+sub+'&body='+body, '_self');
    toast('Ouverture messagerie… 📬');
    document.getElementById('mpanel').classList.remove('on');
  }

  // ── SHARE
  async function shareIt() {
    try {
      var url = await buildStrip();
      var res2 = await fetch(url);
      var blob = await res2.blob();
      var file = new File([blob], 'photo-doctorants.jpg', {type:'image/jpeg'});
      if (navigator.canShare && navigator.canShare({files:[file]})) {
        await navigator.share({files:[file], title:'29ᵉ Séminaire des Doctorants'});
      } else {
        await navigator.share({title:'29ᵉ Séminaire des Doctorants', url: window.location.href});
      }
    } catch(e) { if(e.name!=='AbortError') toast('Partage annulé'); }
  }

  // ── TOAST
  var _tt;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(_tt); _tt = setTimeout(function() { el.classList.remove('on'); }, 2800);
  }

})();
</script>
